
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Liu: Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>

    <!-- Step 1: Commit timeline slider -->
    <div class="commit-filter">
        <label for="commit-progress">
            Show commits until:
            <input
                type="range"
                id="commit-progress"
                min="0"
                max="100"
                value="100"
            >
        </label>
        <time id="commit-max-time"></time>
    </div>

    <div id="stats"></div>

    <h2>Commits by time of day</h2>

    <!-- Step 3: Scrollytelling container -->
    <div id="scrolly-1">
        <div id="scatter-story"></div>

        <div id="scatter-plot">
            <div id="chart"></div>

            <p id="selection-count" hidden>
                No commits selected
            </p>

            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <!-- Existing tooltip -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>

    <!-- Step 2: File unit visualization -->
    <h2>Files by size</h2>
    <dl id="files"></dl>

</body>
</html>
